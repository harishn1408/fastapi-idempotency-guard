[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-idempotency-guard"
version = "0.1.0"
description = "Durable FastAPI idempotency middleware: keyed HMAC-SHA256 request fingerprinting, Redis atomic leases, and zombie-lock TTL recovery"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Harish Nair", email = "harishn1408@gmail.com" }
]
keywords = ["fastapi", "idempotency", "redis", "asgi", "hmac", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
test = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
